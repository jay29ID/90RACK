# QNAP version of the comics stack. Self-contained (no .env needed) so you
# can paste it straight into Container Station → Applications → Create.
# Change the lines marked ← CHANGE before deploying.
#
# Folders (create them in File Station first, see README "On a QNAP"):
#   /share/Container/comics-stack/{kapowarr,komga,shelfmark}   app settings
#   /share/Comics/comics      Kapowarr's library  → Komga "Comics"
#   /share/Comics/books       Shelfmark downloads → Komga "Books"
#   /share/Comics/downloads   Kapowarr temp

services:
  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    environment:
      TZ: America/New_York                  # ← CHANGE
    ports:
      - 5656:5656
    volumes:
      - /share/Container/comics-stack/kapowarr:/app/db
      - /share/Comics/downloads:/app/temp_downloads
      - /share/Comics/comics:/comics

  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    user: "500:100"                         # ← CHANGE to your QNAP user's uid:gid
    environment:
      TZ: America/New_York                  # ← CHANGE
      JAVA_TOOL_OPTIONS: -Xmx1g             # 1g suits a NAS; 2g if you have 8GB+ RAM
    ports:
      - 25600:25600
    volumes:
      - /share/Container/comics-stack/komga:/config
      - /share/Comics/comics:/data/comics:ro
      - /share/Comics/books:/data/books:ro

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    environment:
      PUID: 500                             # ← CHANGE, same uid as above
      PGID: 100                             # ← CHANGE, same gid as above
      TZ: America/New_York                  # ← CHANGE
    ports:
      - 8084:8084
    volumes:
      - /share/Container/comics-stack/shelfmark:/config
      - /share/Comics/books:/books
