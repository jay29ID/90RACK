# QNAP version of the comics stack, written to sit in the same Container
# Station app as an existing *arr + Traefik stack: paste the three services
# under that file's `services:` so they share its `proxy` network, and Traefik
# can serve Komga over HTTPS. It also deploys on its own, minus the Traefik
# part.
#
# Folders (create before deploying):
#   /share/CACHEDEV1_DATA/docker/{kapowarr,komga,shelfmark,audiobookshelf,prowlarr}  app settings
#   /share/CACHEDEV1_DATA/Comics/comics     Kapowarr's library  → Komga "Comics"
#   /share/CACHEDEV1_DATA/Comics/books      Shelfmark downloads → Komga "Books"
#   /share/CACHEDEV1_DATA/Downloads/kapowarr                     Kapowarr temp
#   /share/CACHEDEV1_DATA/Comics/audiobooks  Shelfmark audiobooks → Audiobookshelf
#
# Everything runs as root (0:0), like the rest of the stack.

networks:
  proxy:
    driver: bridge

services:
  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    volumes:
      - '/share/CACHEDEV1_DATA/docker/kapowarr:/app/db'
      - '/share/CACHEDEV1_DATA/Downloads/kapowarr:/app/temp_downloads'
      - '/share/CACHEDEV1_DATA/Comics/comics:/comics'
    ports:
      - '5656:5656'
    networks:
      - proxy
    labels:
      - "traefik.enable=false"

  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - JAVA_TOOL_OPTIONS=-Xmx768m
    volumes:
      - '/share/CACHEDEV1_DATA/docker/komga:/config'
      - '/share/CACHEDEV1_DATA/Comics/comics:/data/comics:ro'
      - '/share/CACHEDEV1_DATA/Comics/books:/data/books:ro'
    ports:
      - '25600:25600'
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komga.rule=Host(`comics.jayflix.ink`)"
      - "traefik.http.routers.komga.entrypoints=websecure"
      - "traefik.http.routers.komga.tls=true"
      - "traefik.http.routers.komga.tls.certresolver=myresolver"
      - "traefik.http.services.komga.loadbalancer.server.port=25600"
      - "traefik.docker.network=proxy"

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - PUID=0
      - PGID=0
    volumes:
      - '/share/CACHEDEV1_DATA/docker/shelfmark:/config'
      - '/share/CACHEDEV1_DATA/Comics/books:/books'
      # Audiobooks go here; Audiobookshelf reads the same folder.
      - '/share/CACHEDEV1_DATA/Comics/audiobooks:/audiobooks'
      # Same path NZBGet uses, so Shelfmark can hand downloads to it.
      - '/share/CACHEDEV1_DATA/Downloads:/downloads'
    ports:
      - '8084:8084'
    networks:
      - proxy
    labels:
      - "traefik.enable=false"

  # Gets Kapowarr past Cloudflare on GetComics. Kapowarr reaches it at
  # http://flaresolverr:8191 over the proxy network; no port on the LAN.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - LOG_LEVEL=info
    networks:
      - proxy
    labels:
      - "traefik.enable=false"

  # Audiobook server + phone app. Shelfmark saves audiobooks to the same
  # folder. Published at audiobooks.jayflix.ink through Traefik.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    volumes:
      - '/share/CACHEDEV1_DATA/docker/audiobookshelf/config:/config'
      - '/share/CACHEDEV1_DATA/docker/audiobookshelf/metadata:/metadata'
      - '/share/CACHEDEV1_DATA/Comics/audiobooks:/audiobooks'
    ports:
      - '13378:80'
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.jayflix.ink`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.tls=true"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=myresolver"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  # Indexer manager: DrunkenSlug/DogNZB set up once here, synced to Sonarr
  # and Radarr, and searched by Shelfmark for books and audiobooks.
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - PUID=0
      - PGID=0
    volumes:
      - '/share/CACHEDEV1_DATA/docker/prowlarr:/config'
    ports:
      - '9696:9696'
    networks:
      - proxy
    labels:
      - "traefik.enable=false"
